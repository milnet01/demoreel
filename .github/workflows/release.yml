name: Release

# When a release is published, build the packages from its tag, test each in
# a clean container of every distro it targets, and attach them
# (docs/specs/DEMO-0068-linux-packages.md § 4.5). A trigger belongs to a whole
# workflow file, which is why this is not a job in ci.yml.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # The one job in this repository that may write to it, to upload the
    # files. ci.sh's full gate fails if that grant appears anywhere else.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install podman
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y podman

      - name: Build and test the packages
        # The same build and test as the gate's, leaving the files behind. A
        # failure here attaches nothing: the upload below does not run.
        timeout-minutes: 25
        run: ./ci.sh --packages --out "$RUNNER_TEMP/release"

      - name: Attach them to the release
        # The tag arrives through env, so the shell sees data rather than code.
        # --clobber: a re-run for the same tag replaces the files.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/release/* --clobber --repo "$GITHUB_REPOSITORY"
