name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Without this the job's token is written into .git/config and stays
          # readable for the rest of the job -- by every later step, and by the
          # linter, the recorder and the target apps that ./ci.sh starts. None
          # of that needs the token. This job only reads, so nothing here has
          # to authenticate.
          persist-credentials: false

      - name: Install the programs demoreel needs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ffmpeg xvfb xdotool x11-apps xterm

      - name: Install ruff
        # The version is ci.sh's, read from ci.sh. A number written here as well
        # would be a second copy to keep in step by hand, and the full gate fails
        # locally if the installed ruff is not the one it names.
        run: pipx install "ruff==$(./ci.sh --ruff-version)"

      - name: Decide which mode to run
        # ci.sh makes the decision, not this file. It owns the glob AND the
        # matching, so this step only has to find the range and hand over the
        # changed paths. A range we cannot resolve falls back to the full gate,
        # never to the docs one.
        id: mode
        # Every value arrives through env, so the shell sees data. Expanded as
        # ${{ }} it would be substituted into the script before the shell runs,
        # which makes it code -- see the note on the gate step below.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA";     head="$HEAD_SHA" ;;
            push)         base="$PUSH_BEFORE_SHA"; head="$HEAD_SHA" ;;
            *)            base=''; head='' ;;
          esac

          mode=""
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$base^{commit}" 2>/dev/null; then
            mode=$(git diff --name-only "$base" "$head" | ./ci.sh --docs-mode)
          else
            echo "no resolvable range; running the full gate"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "running: ./ci.sh $mode"
        shell: bash

      - name: Run the gate
        # Every check lives in ci.sh. Nothing is added here, or the local run
        # and this one would stop being the same thing.
        #
        # MODE arrives through env rather than as ${{ }}. GitHub substitutes a
        # ${{ }} expression into the script before the shell sees it, so the
        # value would be code rather than an argument. Nothing can inject
        # through it today, because the value comes from `ci.sh --docs-mode`
        # and that prints `--docs` or nothing -- but that guarantee is a fact
        # about a script which will keep changing, checked by nobody. This
        # removes the question instead of answering it.
        #
        # Quoted, and empty when the full gate is wanted: ci.sh reads its
        # argument as "${1:-}", so an empty one is simply not "--docs".
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: ./ci.sh "$MODE"
