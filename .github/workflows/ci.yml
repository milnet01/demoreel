name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the programs demoreel needs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ffmpeg xvfb xdotool x11-apps

      - name: Install ruff
        # The version is ci.sh's, read from ci.sh. A number written here as well
        # would be a second copy to keep in step by hand, and the full gate fails
        # locally if the installed ruff is not the one it names.
        run: pipx install "ruff==$(./ci.sh --ruff-version)"

      - name: Decide which mode to run
        # ci.sh makes the decision, not this file. It owns the glob AND the
        # matching, so this step only has to find the range and hand over the
        # changed paths. A range we cannot resolve falls back to the full gate,
        # never to the docs one.
        id: mode
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request) base='${{ github.event.pull_request.base.sha }}'; head='${{ github.sha }}' ;;
            push)         base='${{ github.event.before }}';               head='${{ github.sha }}' ;;
            *)            base=''; head='' ;;
          esac

          mode=""
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$base^{commit}" 2>/dev/null; then
            mode=$(git diff --name-only "$base" "$head" | ./ci.sh --docs-mode)
          else
            echo "no resolvable range; running the full gate"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "running: ./ci.sh $mode"
        shell: bash

      - name: Run the gate
        # Every check lives in ci.sh. Nothing is added here, or the local run
        # and this one would stop being the same thing.
        run: ./ci.sh ${{ steps.mode.outputs.mode }}
