name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the programs demoreel needs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ffmpeg xvfb xdotool x11-apps

      - name: Install ruff
        # Pinned so CI lints with the same ruff a local ./ci.sh run uses.
        # Keep this in step with the version installed on the dev machine.
        run: pipx install ruff==0.16.6

      - name: Decide which mode to run
        # The same decision the local pre-push hook makes, against the same
        # glob -- ci.sh --docs-glob is the single definition both read. A range
        # we cannot resolve falls back to the full gate, never to the docs one.
        id: mode
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request) base='${{ github.event.pull_request.base.sha }}'; head='${{ github.sha }}' ;;
            push)         base='${{ github.event.before }}';               head='${{ github.sha }}' ;;
            *)            base=''; head='' ;;
          esac

          mode=""
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$base" "$head")
            if [ -n "$changed" ]; then
              docs_only=true
              IFS='|' read -r -a globs <<<"$(./ci.sh --docs-glob)"
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                matched=false
                for g in "${globs[@]}"; do
                  # shellcheck disable=SC2053
                  [[ $path == $g ]] && { matched=true; break; }
                done
                $matched || { docs_only=false; break; }
              done <<<"$changed"
              $docs_only && mode="--docs"
            fi
          else
            echo "no resolvable range; running the full gate"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "running: ./ci.sh $mode"
        shell: bash

      - name: Run the gate
        # Every check lives in ci.sh. Nothing is added here, or the local run
        # and this one would stop being the same thing.
        run: ./ci.sh ${{ steps.mode.outputs.mode }}
